<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070f1e">
    <meta name="app-version" content="2.1.0">
    <meta name="app-build" content="20260922-pwa-auto">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mero Sadak">
    <meta name="worker-base-url" content="https://merosadak.banjays.workers.dev">
    <title>Mero Sadak - Nepal Highway & Route Planner</title>
    <meta name="description" content="Comprehensive Nepal highway information, live road status and obstruction tracker, distance calculator, real-time mountain pass weather monitor, real-time D3 traffic flow visualizer with historical and live speed variances, and AI-powered dynamic route planning with trip optimization based on current terrain and road conditions." />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Auto-update bootstrap: runs before the app bundle so old SW is replaced on open/refresh
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var RELOAD_KEY = 'merosadak_sw_reload_at';
        function canReload() {
          try {
            var last = Number(sessionStorage.getItem(RELOAD_KEY) || '0');
            if (Date.now() - last < 15000) return false;
            sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
            return true;
          } catch (e) { return true; }
        }
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (canReload()) location.reload();
        });
        navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).then(function (reg) {
          reg.update().catch(function () {});
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          reg.addEventListener('updatefound', function () {
            var w = reg.installing;
            if (!w) return;
            w.addEventListener('statechange', function () {
              if (w.state === 'installed' && navigator.serviceWorker.controller) {
                w.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(function () {});
        // Drop legacy cache buckets without user action
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              if (k.indexOf('mero-sadak-') === 0 && k.indexOf('-v5') === -1) {
                caches.delete(k);
              }
            });
          }).catch(function () {});
        }
      })();
    </script>
    <script>
      window.addEventListener('unhandledrejection', (event) => {
        if (event?.reason && typeof event.reason === 'object' && !(event.reason instanceof Error)) {
          console.warn('[Mero Sadak] Suppressed unhandled promise rejection:', event.reason);
          event.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
