name: Sync Fuel Prices Daily

on:
  schedule:
    # Runs at 00:45 UTC daily = 06:30 NST (Nepal Standard Time, UTC+5:45)
    - cron: '45 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed to commit updated fuel-prices.json

jobs:
  sync-fuel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run sync:fuel

      # Commit and push if fuel prices changed
      - name: Commit updated fuel prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fuel-prices.json
          git diff --staged --quiet || git commit -m "chore: update fuel prices $(date +'%Y-%m-%d')"
          git push