name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server.ts'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'worker/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase-applet-config.json'
      - '.github/workflows/firebase-hosting.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server.ts'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'worker/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase-applet-config.json'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  worker-typecheck:
    name: Type check worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p worker/tsconfig.json

  build-frontend:
    name: Build frontend
    needs: [typecheck, worker-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:static
      - uses: actions/upload-artifact@v7
        with:
          name: dist-frontend
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-backend:
    name: Build backend
    needs: [typecheck, worker-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: mkdir -p dist
      - run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: dist-backend
          path: dist/server.cjs
          if-no-files-found: error
          retention-days: 1

  deploy-hosting:
    name: Deploy Firebase Hosting
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-frontend
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-backend
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEROSADAK }}'
          channelId: live
          projectId: sadak-sathi-3ab73
          firebaseToolsVersion: '15.30.2'
          entryPoint: .
