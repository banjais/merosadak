name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server.ts'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'worker/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEROSADAK }}'
          channelId: live
          projectId: sadak-sathi-3ab73
          firebaseToolsVersion: '15.30.2'
