name: Sync Toll Rates Weekly

on:
  schedule:
    # Runs at 01:00 UTC every Monday = 06:45 NST
    - cron: '0 1 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed to commit updated toll-rates.json

jobs:
  sync-tolls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run sync:tolls

      # Commit and push if toll rates changed
      - name: Commit updated toll rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/toll-rates.json
          git diff --staged --quiet || git commit -m "chore: update toll rates $(date +'%Y-%m-%d')"
          git push