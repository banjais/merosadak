name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase-applet-config.json'
      - 'server.ts'
      - 'Dockerfile'
      - '.github/workflows/ci-cd.yml'
      - 'worker/wrangler.toml'
      - 'worker/sync-data.js'
      - 'worker/setup-kv.js'
      - 'worker/package.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase-applet-config.json'
      - 'server.ts'
      - 'Dockerfile'
      - '.github/workflows/ci-cd.yml'
      - 'worker/wrangler.toml'
      - 'worker/sync-data.js'
      - 'worker/setup-kv.js'
      - 'worker/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Shared checks ───────────────────────────────────────────────────────────

  typecheck:
    name: Type check application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm exec tsc --noEmit

  worker-typecheck:
    name: Type check worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm exec tsc --noEmit -p worker/tsconfig.json

  # ── Frontend ─────────────────────────────────────────────────────────────────

  build-frontend:
    name: Build frontend (with data sync)
    needs: [typecheck, worker-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: npm
            cache-dependency-path: package-lock.json
        - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
        - run: npm run build
        - uses: actions/upload-artifact@v4
          with:
            name: dist-frontend
            path: dist
            if-no-files-found: error
            retention-days: 1

  deploy-frontend:
    name: Deploy frontend to Firebase Hosting
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_loglevel: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-frontend
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEROSADAK }}
          channelId: live
          projectId: sadak-sathi-3ab73
          entryPoint: .

  # ── Data Sync & Worker Deploy ────────────────────────────────────────────────

  sync-kv:
    name: Sync data to Cloudflare KV
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
        working-directory: worker
      - working-directory: worker
        run: |
          set -euo pipefail
          npm exec --no-install wrangler kv key put "airports.json" --binding DATA --path ../public/data/airports.json --remote
          npm exec --no-install wrangler kv key put "district-hqs.json" --binding DATA --path ../public/data/district-hqs.json --remote
          npm exec --no-install wrangler kv key put "cities.json" --binding DATA --path ../public/data/cities.json --remote
          npm exec --no-install wrangler kv key put "places.json" --binding DATA --path ../public/data/places.json --remote
          npm exec --no-install wrangler kv key put "palika-names.json" --binding DATA --path ../public/data/palika-names.json --remote
          npm exec --no-install wrangler kv key put "highway/index.json" --binding DATA --path ../public/data/highway/index.json --remote
          npm exec --no-install wrangler kv key put "nepal_boundary.geojson" --binding DATA --path ../public/data/nepal_boundary.geojson --remote
          npm exec --no-install wrangler kv key put "distance-matrix.json" --binding DATA --path ../public/data/distance-matrix.json --remote
          npm exec --no-install wrangler kv key put "road-graph.json" --binding DATA --path ../public/data/road-graph.json --remote
          npm exec --no-install wrangler kv key put "snh-reference.json" --binding DATA --path ../public/data/snh-reference.json --remote
          npm exec --no-install wrangler kv key put "calculator-cities.json" --binding DATA --path ../public/data/calculator-cities.json --remote
          npm exec --no-install wrangler kv key put "fuel-prices.json" --binding DATA --path ../public/data/fuel-prices.json --remote
          npm exec --no-install wrangler kv key put "toll-rates.json" --binding DATA --path ../public/data/toll-rates.json --remote
          npm exec --no-install wrangler kv key put "all-toll-rates.json" --binding DATA --path ../public/data/all-toll-rates.json --remote
          npm exec --no-install wrangler kv key put "cities-and-junctions.json" --binding DATA --path ../public/data/cities-and-junctions.json --remote
          npm exec --no-install wrangler kv key put "incidents.json" --binding DATA --path ../public/data/incidents.json --remote
          npm exec --no-install wrangler kv key put "pois.json" --binding DATA --path ../public/data/pois.json --remote
          npm exec --no-install wrangler kv key put "traffic-corridors.json" --binding DATA --path ../public/data/traffic-corridors.json --remote
          npm exec --no-install wrangler kv key put "mountain-weather.json" --binding DATA --path ../public/data/mountain-weather.json --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: sync-kv
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
        working-directory: worker
      - working-directory: worker
        run: npm exec --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}