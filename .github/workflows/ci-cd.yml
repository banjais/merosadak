name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase-applet-config.json'
      - 'server.ts'
      - 'Dockerfile'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase-applet-config.json'
      - 'server.ts'
      - 'Dockerfile'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Shared checks ───────────────────────────────────────────────────────────

  typecheck:
    name: Type check application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  worker-typecheck:
    name: Type check worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p worker/tsconfig.json

  # ── Frontend ─────────────────────────────────────────────────────────────────

  build-frontend:
    name: Build frontend
    needs: [typecheck, worker-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:static
      - uses: actions/upload-artifact@v4
        with:
          name: dist-frontend
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy-frontend:
    name: Deploy frontend to Firebase Hosting
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-frontend
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEROSADAK }}'
          channelId: live
          projectId: sadak-sathi-3ab73
          firebaseToolsVersion: '15.30.2'
          entryPoint: .
