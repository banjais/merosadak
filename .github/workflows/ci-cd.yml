name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase-applet-config.json'
      - 'server.ts'
      - 'Dockerfile'
      - '.github/workflows/ci-cd.yml'
      - 'worker/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'firebase-applet-config.json'
      - 'server.ts'
      - 'Dockerfile'
      - '.github/workflows/ci-cd.yml'
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Shared checks ───────────────────────────────────────────────────────────

  typecheck:
    name: Type check application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npx tsc --noEmit

  worker-typecheck:
    name: Type check worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error --legacy-peer-deps
        working-directory: worker
      - run: npx tsc --noEmit -p worker/tsconfig.json

  # ── Frontend ─────────────────────────────────────────────────────────────────

  build-frontend:
    name: Build frontend (with data sync)
    needs: [typecheck, worker-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: npm
            cache-dependency-path: package-lock.json
        - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
        - run: npm run build
        - uses: actions/upload-artifact@v4
          with:
            name: dist-frontend
            path: dist
            if-no-files-found: error
            retention-days: 1

  deploy-frontend:
    name: Deploy frontend to Firebase Hosting
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_loglevel: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-frontend
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEROSADAK }}
          channelId: live
          projectId: sadak-sathi-3ab73
          entryPoint: .

  # ── Data Sync & Worker Deploy ────────────────────────────────────────────────

  sync-kv:
    name: Sync data to Cloudflare KV
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error --legacy-peer-deps
        working-directory: worker
      # Only upload files whose SHA-256 changed since the last run. Cloudflare's
      # free KV tier caps writes at 1,000/day and the old script wrote ~19 keys
      # on every push, which burned the quota and failed the whole job with
      # "free usage limit reached". The step is non-fatal: the frontend's
      # primary data path is the static /data/* files that Firebase Hosting
      # deploys, and the worker keeps serving the last-synced KV data.
      - working-directory: worker
        run: node sync-data-changed.js
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: sync-kv
    # Data sync can fail on Cloudflare's free KV quota without blocking the
    # worker deploy — the worker keeps serving the last-synced data, and the
    # next push retries. Previously a failed sync aborted the whole workflow.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error --legacy-peer-deps
        working-directory: worker
      - working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}