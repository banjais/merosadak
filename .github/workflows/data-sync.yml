name: Sync Data to Cloudflare KV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Sync data files to KV
        run: |
          cd worker
          npx wrangler kv key put --binding DATA --remote "airports.json" --path "../public/data/airports.json"
          npx wrangler kv key put --binding DATA --remote "district-hqs.json" --path "../public/data/district-hqs.json"
          npx wrangler kv key put --binding DATA --remote "cities.json" --path "../public/data/cities.json"
          npx wrangler kv key put --binding DATA --remote "places.json" --path "../public/data/places.json"
          npx wrangler kv key put --binding DATA --remote "palika-names.json" --path "../public/data/palika-names.json"
          npx wrangler kv key put --binding DATA --remote "highway/index.json" --path "../public/data/highway/index.json"
          npx wrangler kv key put --binding DATA --remote "nepal_boundary.geojson" --path "../public/data/nepal_boundary.geojson"
          npx wrangler kv key put --binding DATA --remote "distance-matrix.json" --path "../public/data/distance-matrix.json"
          npx wrangler kv key put --binding DATA --remote "highway-info.json" --path "../public/data/highway-info.json"
          npx wrangler kv key put --binding DATA --remote "blackspots.json" --path "../public/data/blackspots.json"
          npx wrangler kv key put --binding DATA --remote "mountain-weather.json" --path "../public/data/mountain-weather.json"
          npx wrangler kv key put --binding DATA --remote "traffic-corridors.json" --path "../public/data/traffic-corridors.json"
          npx wrangler kv key put --binding DATA --remote "travel-time.json" --path "../public/data/travel-time.json"
          npx wrangler kv key put --binding DATA --remote "incidents.json" --path "../public/data/incidents.json"
          npx wrangler kv key put --binding DATA --remote "pois.json" --path "../public/data/pois.json"
          npx wrangler kv key put --binding DATA --remote "user-reports.json" --path "../public/data/user-reports.json"
          npx wrangler kv key put --binding DATA --remote "cities-and-junctions.json" --path "../public/data/cities-and-junctions.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: |
          cd worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
