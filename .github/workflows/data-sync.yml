name: Sync Data to Cloudflare KV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Sync data files to KV
        run: |
          cd worker
          set +e
          for f in \
            airports.json \
            bus-stations.json \
            temples.json \
            tourist-places.json \
            landmarks.json \
            district-hqs.json \
            cities.json \
            places.json \
            palika-names.json \
            highway/index.json \
            nepal_boundary.geojson \
            distance-matrix.json \
            highway-info.json \
            blackspots.json \
            mountain-weather.json \
            traffic-corridors.json \
            travel-time.json \
            incidents.json \
            pois.json \
            user-reports.json \
            cities-and-junctions.json
          do
            path="../public/data/$f"
            if [ -f "$path" ]; then
              echo "PUT $f"
              npx wrangler kv key put --binding DATA --remote "$f" --path "$path" || echo "WARN: failed $f"
            else
              echo "SKIP missing $f"
            fi
          done
          set -e
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: |
          cd worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
