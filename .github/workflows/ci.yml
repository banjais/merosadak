name: PR verification

on:
  push:
    branches:
      - fix/distance-report-a4
  pull_request:
    branches:
      - ui/trip-report-sector-deck
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application and Cloudflare Worker
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production application
        run: npm run build
